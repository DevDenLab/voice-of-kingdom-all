# =============================================================================
# Production stack -- Oracle Cloud VM (4 OCPU Ampere/AMD, 24 GB RAM)
#
#   docker compose --env-file .env -f docker-compose.prod.yml up -d
#
# CI pushes images to ghcr.io and this file only ever *pulls* them.
# Nothing is built on the VM.
# =============================================================================

name: vokim

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- reverse proxy
  caddy:
    image: caddy:2.8-alpine
    container_name: vokim-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks: [edge, internal]
    logging: *default-logging

  # ---------------------------------------------------------------- react (nginx)
  frontend:
    image: ${REGISTRY}/frontend:${IMAGE_TAG:-latest}
    container_name: vokim-frontend
    restart: unless-stopped
    expose: ["80"]
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: {memory: 512M}

  # ---------------------------------------------------------------- django
  backend:
    image: ${REGISTRY}/backend:${IMAGE_TAG:-latest}
    container_name: vokim-backend
    restart: unless-stopped
    expose: ["8000"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes:
      - django_static:/app/staticfiles
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: {memory: 3G}

  # ---------------------------------------------------------------- postgres
  postgres:
    image: postgres:16-alpine
    container_name: vokim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: {memory: 4G}

  # ---------------------------------------------------------------- redis
  redis:
    image: redis:7-alpine
    container_name: vokim-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: {memory: 768M}

  # ---------------------------------------------------------------- minio (S3)
  minio:
    image: minio/minio:latest
    container_name: vokim-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://${DOMAIN}/minio/
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: {memory: 2G}

  # Creates the bucket and makes the media prefix publicly readable. Runs once.
  minio-init:
    image: minio/mc:latest
    container_name: vokim-minio-init
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET &&
      echo 'minio bucket ready: '$$S3_BUCKET
      "
    networks: [internal]
    restart: "no"

  # ---------------------------------------------------------------- imgproxy
  # On-the-fly resize/crop/format. This is the Cloudinary transformation layer.
  imgproxy:
    image: darthsim/imgproxy:v3
    container_name: vokim-imgproxy
    restart: unless-stopped
    expose: ["8080"]
    environment:
      IMGPROXY_BIND: ":8080"
      # Unsigned URLs are safe here because ALLOWED_SOURCES pins imgproxy to
      # our own bucket -- it cannot be pointed at arbitrary hosts (no SSRF).
      IMGPROXY_ALLOW_ORIGIN: "https://${DOMAIN}"
      IMGPROXY_ALLOWED_SOURCES: "s3://${S3_BUCKET}/"
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: "http://minio:9000"
      IMGPROXY_S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_MAX_SRC_RESOLUTION: ${IMGPROXY_MAX_SRC_RESOLUTION:-50}
      IMGPROXY_JPEG_PROGRESSIVE: ${IMGPROXY_JPEG_PROGRESSIVE:-true}
      IMGPROXY_ENFORCE_WEBP: ${IMGPROXY_ENFORCE_WEBP:-true}
      IMGPROXY_TTL: "31536000"
    depends_on:
      minio: {condition: service_healthy}
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: {memory: 1G}

networks:
  edge:
  internal:
    internal: false

volumes:
  pg_data:
  redis_data:
  minio_data:
  django_static:
  caddy_data:
  caddy_config:
