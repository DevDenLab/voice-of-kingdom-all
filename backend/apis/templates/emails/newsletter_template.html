<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
        }
        .button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>New Newsletter: {{ document.title }}</h1>
    <p>Dear Subscriber,</p>
    <p>A new document has been uploaded. You can check it out here:</p>
    {% comment %} <a href="https://vokim.ca{{ document.file.url }}" class="button">Download Newsletter</a> {% endcomment %}
    <p>Thank you for subscribing!</p>
</body>
</html>
