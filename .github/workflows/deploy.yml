name: Deploy to AWS EC2

# Fires on every push to develop or prod. Builds both images, pushes them to GitHub Container
# Registry, then SSHes into the EC2 instance and rolls the stack forward.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST            Elastic IP of the EC2 instance
#   EC2_USER            ssh user (ubuntu)
#   EC2_SSH_KEY         private key, full PEM including BEGIN/END lines
#   EC2_SSH_PORT        optional, defaults to 22
#   EC2_APP_DIR         optional, defaults to /opt/vokim
#   ADMIN_PASSWORD      password for the site admin created on every deploy
#   ADMIN_USERNAME      optional, defaults to admin
# GITHUB_TOKEN is provided automatically and is what pushes to ghcr.io.
#
# Images are built for linux/arm64 because the EC2 instance is a t4g
# (Graviton) ARM machine, not x86 -- confirm with `uname -m` on the VM if this
# ever changes. The runner itself is x86_64, so the arm64 build runs under
# QEMU emulation (docker/setup-qemu-action below), which is slower than a
# native build but requires no extra infrastructure.

on:
  push:
    branches: [develop, prod]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the CI gate (emergency deploy)"
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------- 1. build
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Compute image tag and namespace
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          # ghcr.io repository names must be lowercase; github.repository
          # preserves the repo's actual case (DevDenLab/...), which docker
          # buildx rejects outright ("repository name must be lowercase").
          repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "namespace=ghcr.io/${repo_lower}" >> "$GITHUB_OUTPUT"
          echo "Building tag ${GITHUB_SHA::12} for ${repo_lower}"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.namespace }}/backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.namespace }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          build-args: |
            REACT_APP_API_URL=
            REACT_APP_IMG_BASE=/img
            REACT_APP_MEDIA_BASE=/media
          tags: |
            ${{ steps.meta.outputs.namespace }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.namespace }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------- 2. deploy
  deploy:
    name: Roll out on EC2
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://vokim.ca

    steps:
      - uses: actions/checkout@v4

      - name: Copy infra files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "infra/docker-compose.prod.yml,infra/caddy/Caddyfile"
          target: ${{ secrets.EC2_APP_DIR || '/opt/vokim' }}
          strip_components: 1
          overwrite: true

      - name: Pull new images and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: IMAGE_TAG,ADMIN_USERNAME,ADMIN_PASSWORD
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR || '/opt/vokim' }}"
            cd "$APP_DIR"

            # .env lives only on the VM and is never in git.
            if [ ! -f .env ]; then
              echo "::error::$APP_DIR/.env is missing. Create it from infra/.env.example first."
              exit 1
            fi

            # Pin this rollout to the freshly built tag.
            grep -q '^IMAGE_TAG=' .env \
              && sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env \
              || echo "IMAGE_TAG=${IMAGE_TAG}" >> .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Back up the database before migrations run.
            mkdir -p backups
            if docker compose -f docker-compose.prod.yml ps -q postgres >/dev/null 2>&1; then
              set +e
              docker compose --env-file .env -f docker-compose.prod.yml exec -T postgres \
                pg_dump -U "$(grep '^POSTGRES_USER=' .env | cut -d= -f2)" \
                        -d "$(grep '^POSTGRES_DB=' .env | cut -d= -f2)" \
                > "backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql"
              set -e
              ls -t backups/*.sql 2>/dev/null | tail -n +11 | xargs -r rm --
            fi

            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f --filter "until=168h"

            echo "waiting for backend to become healthy..."
            for i in $(seq 1 30); do
              if curl -fsS http://localhost/healthz/ >/dev/null 2>&1; then
                echo "backend healthy after ${i} attempts"

                # Create the gallery/Django admin, or reset its password to the
                # ADMIN_PASSWORD secret, so the secret is the source of truth.
                if [ -n "${ADMIN_PASSWORD:-}" ]; then
                  docker compose --env-file .env -f docker-compose.prod.yml exec -T                     -e ADMIN_USERNAME -e ADMIN_PASSWORD backend python manage.py shell -c "
            import os
            from django.contrib.auth import get_user_model
            U = get_user_model()
            u, created = U.objects.get_or_create(username=os.environ['ADMIN_USERNAME'])
            u.is_staff = u.is_superuser = u.is_active = True
            u.set_password(os.environ['ADMIN_PASSWORD'])
            u.save()
            print('admin user', 'created' if created else 'updated')
            "
                else
                  echo "::warning::ADMIN_PASSWORD secret not set - skipping admin user"
                fi
                exit 0
              fi
              sleep 5
            done
            echo "::error::backend did not become healthy"
            docker compose -f docker-compose.prod.yml logs --tail=100 backend
            exit 1

      - name: Public smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://vokim.ca/ || true)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::https://vokim.ca did not return 200"
          exit 1
