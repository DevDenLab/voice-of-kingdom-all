name: CI

# Runs on every push to develop and on PRs into develop or prod.
# Fast feedback only -- it never deploys anything.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, prod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vokim_test
          POSTGRES_USER: vokim
          POSTGRES_PASSWORD: vokim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vokim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECURE_SSL_REDIRECT: "False"
      POSTGRES_DB: vokim_test
      POSTGRES_USER: vokim
      POSTGRES_PASSWORD: vokim
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      USE_S3_MEDIA: "False"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check . --output-format=github || true

      - name: Django system check
        run: python manage.py check

      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --noinput -v 2

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          CI: "false"          # CRA treats warnings as errors otherwise
          GENERATE_SOURCEMAP: "false"
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 5

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Built for the runner's native amd64 here -- this is just a "does the
      # Dockerfile build" smoke test. deploy.yml builds the real linux/arm64
      # images that actually ship to the Oracle VM.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Validate production compose file
        run: |
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/docker-compose.prod.yml config -q
          echo "compose config OK"
